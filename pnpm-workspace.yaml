packages:
  - apps/*
  - packages/*
  - scripts/*
  - brand

# One place for shared tool and library versions. Packages reference them as "catalog:".
catalog:
  "@electric-sql/pglite": 0.5.8
  "@eslint/js": 10.0.1
  "@next/eslint-plugin-next": 16.3.6
  "@t3-oss/env-nextjs": 0.13.11
  "@types/node": 22.20.4
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  # Pre-1.0: a caret on 0.x stays within the minor. Upgrades go through a PR that re-records fixtures.
  "@typesafe-ai/sdk": ^0.7.0
  # Pre-1.0 as well. Only packages/llm-client imports it.
  "@anthropic-ai/sdk": ^0.128.0
  # Auth library (ADR-002). Pinned exactly: plugin APIs shift between minors, so upgrades get a review.
  better-auth: 1.7.7
  # TOTP setup QR codes in the console (D3). Rendered to SVG on the server.
  qrcode: 1.5.4
  "@types/qrcode": 1.5.6
  "@vitest/coverage-v8": 5.0.2
  "@tailwindcss/postcss": 4.3.3
  "@types/mdx": 2.0.14
  eslint: 10.11.0
  eslint-import-resolver-typescript: 4.4.5
  # Docs site (apps/docs). fumadocs-ui pins fumadocs-core to the same version, so move them together.
  fumadocs-core: 16.15.15
  fumadocs-mdx: 15.4.5
  fumadocs-openapi: 12.0.4
  fumadocs-ui: 16.15.15
  eslint-plugin-boundaries: 7.2.0
  globals: 17.12.0
  next: 16.3.6
  pg: 8.23.0
  postcss: 8.5.28
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.4
  # TypeScript 7 is outside the typescript-eslint 8 peer range (>=4.8.4 <6.1.0), so this pins the newest 5.x.
  typescript: 5.9.3
  typescript-eslint: 8.70.1
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5

# unrs-resolver and esbuild (through tsx) ship prebuilt bindings, so their postinstalls are not needed.
ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver
